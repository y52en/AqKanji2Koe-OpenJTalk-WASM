[package]
name = "aqkanji2koe-wasm"
version = "0.1.1"
edition = "2021"
description = "WebAssembly bindings for the OpenJTalk-based kanji-to-AquesTalk notation converter"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
aqkanji2koe = { path = "../aqkanji2koe" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
